schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Project: FarmaGestão, sistema web de gestão de farmácia
  (trabalho de faculdade em grupo).

  Domain: Gestão interna de vendas, estoque, produtos, clientes,
  fornecedores e equipe. Há dois perfis com login: gestor e colaborador.
  O cliente é apenas um cadastro, sem acesso ao sistema.
  Visão, escopo e regras estão em docs/project-overview.md.
  Entidades e relacionamentos estão em docs/domain-model.md.

  Tech stack:
    Backend e banco de dados: Xano (lógica em XanoScript).
    Frontend: Reflex (Python).
    Versionamento: Git e GitHub.

  Architecture:
    O backend é responsável por regras de negócio, autorização por
    perfil e persistência. O frontend apenas apresenta os dados e
    não deve ser considerado mecanismo de segurança.
    O estoque fica no próprio produto. Não usar as tabelas lote,
    pedido_compra, item_pedido_compra e movimentacao_estoque.

  Security:
    Autorização por perfil aplicada na API.
    Senhas armazenadas com hash.
    Clientes e usuários de funcionários não são apagados,
    e sim inativados.

  Development:
    O projeto é desenvolvido incrementalmente com OpenSpec,
    por changes verticais: cada change entrega uma funcionalidade
    completa (Xano e Reflex) e pode ser testada isoladamente,
    sem quebrar o que já funciona.

    Ajustes de banco são aditivos e limitados ao que a change precisa.

    Mudanças relevantes devem ser especificadas antes da implementação.

  Language:
    Escrever a documentação do projeto e os artefatos OpenSpec
    em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, o objetivo e o escopo.
    - Indicar o que a change entrega no Xano e no Reflex.
    - Identificar o que está fora do escopo quando necessário.

  specs:
    - Escrever requisitos verificáveis.
    - Utilizar cenários para comportamentos relevantes, incluindo
      cada perfil afetado (gestor e colaborador).

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.
    - Ordenar as tarefas de modo que a change possa ser testada
      de ponta a ponta no final.

operations:
  apply:
    guidance:
      - Executar as verificações relevantes antes de concluir as tarefas.
      - Trabalhar em um branch do Git por change.

  archive:
    guidance:
      - Confirmar que a implementação corresponde às especificações.